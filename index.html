<div id="swap" class="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 5px;">
        <h3 style="margin: 0;">Swap</h3>
        <span style="font-size: 18px; color: #848e9c; cursor: pointer;">🕒</span>
    </div>

    <div class="swap-card-pro">
        <div class="swap-header">
            <span>From</span>
            <span style="font-size: 12px; color: #848e9c;">👛 <span id="user-balance">0.00</span></span>
        </div>
        <div class="swap-body">
            <div class="token-select-pill" onclick="openTokenList('from')">
                <img id="from-icon" src="https://cryptologos.cc/logos/solana-sol-logo.png" width="24">
                <span id="from-symbol" style="font-weight: bold; margin-left: 8px;">SOL</span>
                <span style="font-size: 10px; margin-left: 5px; color: #848e9c;">❯</span>
            </div>
            <input type="number" class="swap-input-field" id="input-from" placeholder="0" oninput="calculateSwap()">
        </div>
        <div class="swap-footer">
            <small style="color: #848e9c;">Solana Network</small>
            <div class="percent-group">
                <button class="chip" onclick="setPercent(0.25)">25%</button>
                <button class="chip" onclick="setPercent(0.50)">50%</button>
                <button class="chip" onclick="setPercent(1)">Max</button>
            </div>
        </div>
    </div>

    <div class="switch-container">
        <div class="switch-btn" onclick="switchTokens()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4M7 4L3 8M7 4L11 8M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
        </div>
    </div>

    <div class="swap-card-pro" style="margin-top: -5px;">
        <div class="swap-header">
            <span>To</span>
            <span style="font-size: 12px; color: #848e9c;">Balance: 0</span>
        </div>
        <div class="swap-body">
            <div class="token-select-pill" onclick="openTokenList('to')">
                <img id="to-icon" src="https://cryptologos.cc/logos/usd-coin-usdc-logo.png" width="24">
                <span id="to-symbol" style="font-weight: bold; margin-left: 8px;">USDC</span>
                <span style="font-size: 10px; margin-left: 5px; color: #848e9c;">❯</span>
            </div>
            <input type="number" class="swap-input-field" id="input-to" placeholder="0" readonly>
        </div>
        <div class="swap-footer">
            <small style="color: #848e9c;">USD Coin</small>
            <small style="color: #848e9c;">Rp 0</small>
        </div>
    </div>

    <button class="continue-btn" onclick="executeSwap()">Continue</button>
</div>
