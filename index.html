<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Hunter - Realtime Edition</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #0b0e11; --card: #1e2329; --primary: #02c076; --text: #eaeaea; --accent: #474d57; --input: #2b3139; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: var(--card); padding: 25px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #333; }
        
        .tabs { display: flex; justify-content: space-around; margin-top: 25px; border-top: 1px solid #333; padding-top: 15px; }
        .tab-btn { background: none; border: none; color: #848e9c; cursor: pointer; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .tab-btn.active { color: var(--primary); }
        
        .content { display: none; animation: fadeIn 0.3s; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .logo { width: 45px; margin-bottom: 10px; }
        .balance-amount { font-size: 32px; font-weight: bold; margin: 5px 0; }
        .fiat-val { color: var(--primary); font-size: 16px; margin-bottom: 20px; }
        #qrcode { background: white; padding: 10px; border-radius: 12px; display: inline-block; margin-bottom: 15px; }
        .address-box { background: #0b0e11; padding: 12px; border-radius: 10px; font-size: 10px; word-break: break-all; color: #b7bdc6; margin-bottom: 15px; border: 1px solid var(--accent); cursor: pointer; }

        /* Style List Token */
        .token-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #161a1e; border-radius: 12px; margin-bottom: 8px; text-align: left; }
        .token-name { font-weight: bold; font-size: 14px; }
        .token-price { font-size: 11px; color: #848e9c; }
        .input-ca { background: var(--input); border: 1px solid #444; color: white; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; outline: none; }
        button.main-btn { background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; font-size: 16px; cursor: pointer; }
        button.sec-btn { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="wallet" class="content active">
        <img src="https://cryptologos.cc/logos/solana-sol-logo.png" class="logo">
        <div style="color: #848e9c; font-size: 13px;">Saldo Dompet</div>
        <div class="balance-amount">0.00 SOL</div>
        <div id="solPriceHome" class="fiat-val">Memuat harga...</div>
        <div id="qrcode"></div>
        <div class="address-box" id="addressDisplay" onclick="copyAddr()">Loading...</div>
        <button class="main-btn" onclick="buatWalletBaru()">Buat Wallet Baru</button>
    </div>

    <div id="tokens" class="content">
        <h3 style="text-align: left;">Market Assets</h3>
        <div id="tokenList">
            <div class="token-item">
                <div><span class="token-name">SOL</span><br><span id="price-sol" class="token-price">Rp 0</span></div>
                <div><b>0.00</b></div>
            </div>
            <div class="token-item">
                <div><span class="token-name">BTC</span><br><span id="price-btc" class="token-price">Rp 0</span></div>
                <div><b>0.00</b></div>
            </div>
            <div class="token-item">
                <div><span class="token-name">ETH</span><br><span id="price-eth" class="token-price">Rp 0</span></div>
                <div><b>0.00</b></div>
            </div>
            <div class="token-item">
                <div><span class="token-name">USDC</span><br><span id="price-usdc" class="token-price">Rp 0</span></div>
                <div><b>0.00</b></div>
            </div>
        </div>
        <div style="margin-top: 20px; border-top: 1px solid #333; padding-top: 15px;">
            <input type="text" id="caInput" class="input-ca" placeholder="Masukkan CA Koin Micin...">
            <button class="sec-btn" onclick="importToken()">+ Impor Token Manual</button>
        </div>
    </div>

    <div id="swap" class="content">
        <h3 style="text-align: left;">Swap</h3>
        <div style="background: var(--input); padding: 15px; border-radius: 15px; text-align: left; margin-bottom: 10px;">
            <div style="font-size: 11px; color: #848e9c;">Jual (SOL)</div>
            <input type="number" style="background:none; border:none; color:white; font-size:20px; width:100%; outline:none;" placeholder="0.00">
        </div>
        <div style="margin: 10px 0;">⬇️</div>
        <div style="background: var(--input); padding: 15px; border-radius: 15px; text-align: left;">
            <div style="font-size: 11px; color: #848e9c;">Beli (Input CA)</div>
            <input type="text" class="input-ca" placeholder="Paste CA Koin Micin...">
        </div>
        <button class="main-btn" style="margin-top: 15px;">Tukar Sekarang</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('wallet')">🏠<br>Home</button>
        <button class="tab-btn" onclick="openTab('tokens')">🪙<br>Tokens</button>
        <button class="tab-btn" onclick="openTab('swap')">🔄<br>Swap</button>
    </div>
</div>

<script>
    async function updateHarga() {
        try {
            const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=solana,bitcoin,ethereum,usd-coin&vs_currencies=idr');
            const data = await res.json();
            
            const sol = data.solana.idr;
            const btc = data.bitcoin.idr;
            const eth = data.ethereum.idr;
            const usdc = data['usd-coin'].idr;

            document.getElementById('solPriceHome').innerText = `≈ Rp ${sol.toLocaleString('id-ID')}`;
            document.getElementById('price-sol').innerText = `Rp ${sol.toLocaleString('id-ID')}`;
            document.getElementById('price-btc').innerText = `Rp ${btc.toLocaleString('id-ID')}`;
            document.getElementById('price-eth').innerText = `Rp ${eth.toLocaleString('id-ID')}`;
            document.getElementById('price-usdc').innerText = `Rp ${usdc.toLocaleString('id-ID')}`;
        } catch (e) { console.log("Gagal ambil harga"); }
    }

    function openTab(name) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function importToken() {
        const ca = document.getElementById('caInput').value;
        if(ca.length < 30) return alert("CA tidak valid!");
        const list = document.getElementById('tokenList');
        const div = document.createElement('div');
        div.className = 'token-item';
        div.innerHTML = `<div><span class="token-name">MICIN</span><br><span class="token-price">${ca.substring(0,6)}...</span></div><div><b>0.00</b></div>`;
        list.appendChild(div);
        document.getElementById('caInput').value = "";
    }

    function muatWallet() {
        const saved = localStorage.getItem("solana_pro_key");
        if (saved) {
            const arr = new Uint8Array(JSON.parse(saved));
            const kp = solanaWeb3.Keypair.fromSecretKey(arr);
            const addr = kp.publicKey.toBase58();
            document.getElementById('addressDisplay').innerText = addr;
            new QRCode(document.getElementById("qrcode"), { text: addr, width: 120, height: 120 });
        }
    }

    function buatWalletBaru() {
        if(confirm("Buat baru?")) {
            const kp = solanaWeb3.Keypair.generate();
            localStorage.setItem("solana_pro_key", JSON.stringify(Array.from(kp.secretKey)));
            location.reload();
        }
    }

    function copyAddr() {
        navigator.clipboard.writeText(document.getElementById('addressDisplay').innerText);
        alert("Alamat disalin!");
    }

    window.onload = () => { muatWallet(); updateHarga(); setInterval(updateHarga, 30000); };
</script>
</body>
</html>
