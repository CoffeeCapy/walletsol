<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Micin Hunter Wallet</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #0b0e11; --card: #1e2329; --primary: #02c076; --text: #eaeaea; --accent: #474d57; --input: #2b3139; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: var(--card); padding: 25px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #333; }
        
        .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .tab-btn { background: none; border: none; color: #848e9c; cursor: pointer; font-weight: bold; padding: 10px; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        
        .content { display: none; }
        .content.active { display: block; }

        .balance-amount { font-size: 32px; font-weight: bold; margin: 5px 0; }
        .fiat-val { color: var(--primary); font-size: 16px; margin-bottom: 20px; }
        
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { font-size: 12px; color: #848e9c; margin-bottom: 5px; display: block; }
        .custom-input { background: var(--input); border: 1px solid #444; color: white; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; outline: none; }

        .token-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--input); border-radius: 12px; margin-bottom: 10px; }
        .btn-action { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('wallet')">Wallet</button>
        <button class="tab-btn" onclick="openTab('swap')">Swap Micin</button>
    </div>

    <div id="wallet" class="content active">
        <div style="color: #848e9c; font-size: 13px;">Total Balance</div>
        <div class="balance-amount">0.00 SOL</div>
        <div class="fiat-val">≈ Rp 1.454.257</div>
        
        <div id="tokenList">
            <div class="token-item">
                <span><b>SOL</b> (Solana)</span>
                <span>0.00</span>
            </div>
        </div>

        <hr style="border: 0.5px solid #333; margin: 20px 0;">
        
        <div class="input-group">
            <label>Import Custom Token (Mint Address)</label>
            <input type="text" id="caToken" class="custom-input" placeholder="Masukkan Alamat Kontrak...">
            <button class="btn-action" style="background: #474d57; color: white;" onclick="importToken()">+ Add Custom Token</button>
        </div>
    </div>

    <div id="swap" class="content">
        <h3>Swap Micin</h3>
        <div class="input-group">
            <label>From (SOL)</label>
            <input type="number" class="custom-input" placeholder="0.00">
        </div>
        <div style="margin: 10px 0;">⬇️</div>
        <div class="input-group">
            <label>To (Paste Smart Contract Koin Micin)</label>
            <input type="text" class="custom-input" placeholder="Contoh: 4k3Dy9... (CA Koin)">
        </div>
        <div class="input-group">
            <label>Estimate Received</label>
            <input type="text" class="custom-input" placeholder="0.00" readonly>
        </div>
        <button class="btn-action">Swap Now</button>
    </div>

    <div style="font-size: 10px; color: #848e9c; margin-top: 20px;">
        Alamat Wallet: <span id="addr">Loading...</span>
    </div>
</div>

<script>
    function openTab(name) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // Fungsi simulasi import koin micin
    function importToken() {
        const ca = document.getElementById('caToken').value;
        if(ca.length < 32) return alert("Alamat Kontrak Tidak Valid!");
        
        const list = document.getElementById('tokenList');
        const newToken = document.createElement('div');
        newToken.className = 'token-item';
        // Simulasi nama koin (di aplikasi asli, ini akan fetch metadata dari blockchain)
        const shortCA = ca.substring(0,4) + "..." + ca.substring(ca.length-4);
        newToken.innerHTML = `<span><b>MICIN</b> (${shortCA})</span> <span>0.00</span>`;
        list.appendChild(newToken);
        
        document.getElementById('caToken').value = "";
        alert("Token Micin Berhasil Ditambahkan!");
    }

    function muatWallet() {
        const saved = localStorage.getItem("solana_pro_key");
        if (saved) {
            const arr = new Uint8Array(JSON.parse(saved));
            const kp = solanaWeb3.Keypair.fromSecretKey(arr);
            document.getElementById('addr').innerText = kp.publicKey.toBase58();
        }
    }

    window.onload = muatWallet;
</script>
</body>
</html>
