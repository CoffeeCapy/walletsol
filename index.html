<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Hunter - Live Price Edition</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { 
            --bg: #0b0e11; --card: #1e2329; --primary: #02c076; --text: #eaeaea; 
            --accent: #2b3139; --input: #161a1e; --danger: #f6465d;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; overflow-x: hidden; }
        .container { width: 100%; max-width: 450px; min-height: 100vh; position: relative; padding-bottom: 90px; box-sizing: border-box; }
        
        .page-content { display: none; padding: 20px; animation: fadeIn 0.2s ease; }
        .page-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- UI COMPONENTS --- */
        .total-balance { font-size: 38px; font-weight: bold; text-align: center; margin-top: 15px; }
        .action-icon { background: var(--card); width: 50px; height: 50px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .action-icon.highlight { background: var(--primary); color: #000; }
        .token-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(128,128,128,0.05); cursor: pointer; }
        
        /* --- SEARCH & INPUTS --- */
        .search-input { width: 100%; background: var(--input); border: 1px solid var(--accent); padding: 12px; border-radius: 12px; color: white; box-sizing: border-box; outline: none; margin-bottom: 15px; }
        .swap-card { background: var(--input); border-radius: 20px; padding: 18px; margin-bottom: 5px; position: relative; }
        .swap-input { background: none; border: none; color: var(--text); font-size: 24px; font-weight: bold; text-align: right; width: 50%; outline: none; }
        .switch-circle { background: var(--card); border: 4px solid var(--bg); width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: -15px auto; position: relative; z-index: 5; cursor: pointer; }

        /* --- SETTINGS --- */
        .wallet-box { background: linear-gradient(135deg, #02c076, #007d4d); color: #000; padding: 20px; border-radius: 20px; margin-bottom: 20px; text-align: center; }
        .phrase-box { background: rgba(0,0,0,0.1); padding: 10px; border-radius: 10px; margin-top: 10px; font-family: monospace; font-size: 10px; display: none; word-break: break-all; border: 1px dashed #000; }

        /* --- NAV --- */
        .nav-bar { position: fixed; bottom: 0; width: 100%; max-width: 450px; background: var(--bg); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid rgba(128,128,128,0.1); z-index: 100; }
        .nav-link { background: none; border: none; color: #848e9c; font-size: 10px; text-align: center; cursor: pointer; }
        .nav-link.active { color: var(--primary); }
    </style>
</head>
<body id="appBody">

<div class="container">
    
    <div id="home" class="page-content active">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span onclick="showPage('settings')" style="cursor:pointer; font-size: 20px;">⚙️</span>
            <span onclick="startScan()" style="cursor:pointer; font-size: 20px;">🔍</span>
        </div>
        <div class="total-balance">Rp0</div>
        <div style="color:#848e9c; text-align:center; font-size:12px; margin-bottom:25px;" id="walletSummary">Wallet Inactive</div>

        <div class="action-row" style="display:flex; justify-content:space-between; margin-bottom:30px">
            <div style="text-align:center"><div class="action-icon">↗</div><small>Send</small></div>
            <div style="text-align:center"><div class="action-icon">＋</div><small>Fund</small></div>
            <div onclick="showPage('swap')" style="text-align:center"><div class="action-icon highlight">⇆</div><small>Swap</small></div>
            <div style="text-align:center"><div class="action-icon">🏛</div><small>Sell</small></div>
            <div style="text-align:center"><div class="action-icon">🌱</div><small>Earn</small></div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
            <b style="font-size: 18px;">Assets</b>
            <small style="color:var(--primary); cursor:pointer" onclick="updatePrices()">🔄 Refresh Price</small>
        </div>
        <div id="homeTokenList"></div>
        <div style="text-align:center; color:var(--primary); font-weight:bold; margin-top:25px; cursor:pointer" onclick="showPage('manage')">Manage crypto</div>
    </div>

    <div id="manage" class="page-content">
        <h3 onclick="showPage('home')" style="cursor:pointer">← Manage Crypto</h3>
        <input type="text" class="search-input" id="tokenSearch" placeholder="Search token..." oninput="filterTokens()">
        <div id="manageListContainer"></div>
    </div>

    <div id="swap" class="page-content">
        <h3>Swap</h3>
        <div class="swap-card">
            <div style="display:flex; justify-content:space-between; font-size:12px; color:#848e9c; margin-bottom:10px"><span>From</span><span>Bal: 0.00</span></div>
            <div style="display:flex; justify-content:space-between; align-items:center">
                <div style="display:flex; align-items:center; background:var(--card); padding:5px 12px; border-radius:50px">
                    <img id="swap-from-img" src="https://cryptologos.cc/logos/solana-sol-logo.png" width="20">
                    <span id="swap-from-sym" style="margin-left:8px; font-weight:bold">SOL</span>
                </div>
                <input type="number" id="input-from" class="swap-input" placeholder="0" oninput="calculateSwap()">
            </div>
        </div>
        <div class="switch-circle" onclick="swapToggle()">⇅</div>
        <div class="swap-card" style="margin-top:0">
            <div style="display:flex; justify-content:space-between; font-size:12px; color:#848e9c; margin-bottom:10px"><span>To (Estimate)</span><span>Bal: 0.00</span></div>
            <div style="display:flex; justify-content:space-between; align-items:center">
                <div style="display:flex; align-items:center; background:var(--card); padding:5px 12px; border-radius:50px">
                    <img id="swap-to-img" src="https://cryptologos.cc/logos/usd-coin-usdc-logo.png" width="20">
                    <span id="swap-to-sym" style="margin-left:8px; font-weight:bold">USDC</span>
                </div>
                <input type="number" id="input-to" class="swap-input" placeholder="0" readonly style="color:var(--primary)">
            </div>
        </div>
        <p id="rate-info" style="font-size:11px; color:#848e9c; text-align:center; margin-top:10px">Loading prices...</p>
        <button style="background:var(--primary); color:#000; width:100%; padding:16px; border-radius:50px; border:none; font-weight:bold; margin-top:20px; font-size:16px;">Review Swap</button>
    </div>

    <div id="browser" class="page-content">
        <h3>Browser</h3>
        <input type="text" class="search-input" placeholder="Search or enter URL...">
        <div style="display:grid; grid-template-columns: repeat(2,1fr); gap:10px">
            <div style="background:var(--card); padding:15px; border-radius:12px; text-align:center">🪐 Jupiter</div>
            <div style="background:var(--card); padding:15px; border-radius:12px; text-align:center">☀️ Raydium</div>
        </div>
    </div>

    <div id="settings" class="page-content">
        <h3 onclick="showPage('home')" style="cursor:pointer">← Settings</h3>
        <div class="wallet-box">
            <div id="setupWallet">
                <button onclick="createNewWallet()" style="background:#000; color:#fff; border:none; padding:10px 20px; border-radius:10px; font-weight:bold; cursor:pointer">Generate Wallet</button>
            </div>
            <div id="viewWallet" style="display:none">
                <p id="pubKeyDisplay" style="font-size:10px; word-break:break-all;"></p>
                <button onclick="togglePhrase()" style="background:rgba(0,0,0,0.2); border:none; padding:8px; border-radius:8px; font-size:10px; cursor:pointer">Show Secret Key</button>
                <div id="phraseDisplay" class="phrase-box"></div>
            </div>
        </div>
        <div id="reader" style="display:none; width:100%; border-radius:15px; overflow:hidden; margin-bottom:15px;"></div>
        <div style="background:var(--input); padding:15px; border-radius:12px; margin-bottom:10px" onclick="startScan()">📷 Scan QR Code</div>
        <div style="color:var(--danger); padding:15px; text-align:center; cursor:pointer" onclick="resetData()">Reset All Data</div>
    </div>

    <nav class="nav-bar">
        <button class="nav-link active" id="nav-home" onclick="showPage('home')">🏠<br>Home</button>
        <button class="nav-link" id="nav-swap" onclick="showPage('swap')">🔄<br>Trade</button>
        <button class="nav-link" id="nav-manage" onclick="showPage('manage')">🛡️<br>Manage</button>
        <button class="nav-link" id="nav-browser" onclick="showPage('browser')">🧭<br>Browser</button>
    </nav>
</div>

<script>
    let scanner;
    let tokens = [
        { id: 'solana', name: 'SOL', full: 'Solana', img: 'https://cryptologos.cc/logos/solana-sol-logo.png', active: true, price: 0 },
        { id: 'usd-coin', name: 'USDC', full: 'USD Coin', img: 'https://cryptologos.cc/logos/usd-coin-usdc-logo.png', active: true, price: 0 },
        { id: 'bitcoin', name: 'BTC', full: 'Bitcoin', img: 'https://cryptologos.cc/logos/bitcoin-btc-logo.png', active: false, price: 0 },
        { id: 'ethereum', name: 'ETH', full: 'Ethereum', img: 'https://cryptologos.cc/logos/ethereum-eth-logo.png', active: false, price: 0 }
    ];

    // FUNGSI API COINGECKO
    async function updatePrices() {
        try {
            const ids = tokens.map(t => t.id).join(',');
            const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=idr`);
            const data = await res.json();
            
            tokens.forEach(t => {
                if(data[t.id]) t.price = data[t.id].idr;
            });
            renderApp();
            calculateSwap(); 
        } catch (e) { console.log("Price fetch failed"); }
    }

    function renderApp() {
        const hList = document.getElementById('homeTokenList');
        const mList = document.getElementById('manageListContainer');
        hList.innerHTML = ''; mList.innerHTML = '';

        tokens.forEach((t, i) => {
            const priceTxt = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(t.price);
            
            mList.innerHTML += `<div class="token-row token-item-data" data-name="${t.name}">
                <div style="display:flex; align-items:center; gap:10px"><img src="${t.img}" width="30"><b>${t.name}</b></div>
                <input type="checkbox" ${t.active ? 'checked' : ''} onchange="toggleT(${i})">
            </div>`;

            if(t.active) {
                hList.innerHTML += `<div class="token-row" onclick="showPage('swap')">
                    <div style="display:flex; align-items:center; gap:12px"><img src="${t.img}" width="35"><div><b>${t.name}</b><br><small style="color:#848e9c">${t.full}</small></div></div>
                    <div style="text-align:right"><b>0</b><br><small style="color:var(--primary)">${t.price ? priceTxt : 'Loading...'}</small></div>
                </div>`;
            }
        });
        updateWallet();
    }

    function toggleT(i) { tokens[i].active = !tokens[i].active; renderApp(); }

    function filterTokens() {
        const q = document.getElementById('tokenSearch').value.toLowerCase();
        document.querySelectorAll('.token-item-data').forEach(item => {
            item.style.display = item.getAttribute('data-name').toLowerCase().includes(q) ? 'flex' : 'none';
        });
    }

    function calculateSwap() {
        const val = document.getElementById('input-from').value;
        const fToken = tokens.find(t => t.name === document.getElementById('swap-from-sym').innerText);
        const tToken = tokens.find(t => t.name === document.getElementById('swap-to-sym').innerText);
        
        if(val && fToken.price && tToken.price) {
            const res = (val * fToken.price) / tToken.price;
            document.getElementById('input-to').value = res.toFixed(4);
            document.getElementById('rate-info').innerText = `1 ${fToken.name} ≈ ${(fToken.price / tToken.price).toFixed(2)} ${tToken.name}`;
        }
    }

    function swapToggle() {
        const s1 = document.getElementById('swap-from-sym'), s2 = document.getElementById('swap-to-sym');
        const i1 = document.getElementById('swap-from-img'), i2 = document.getElementById('swap-to-img');
        [s1.innerText, s2.innerText] = [s2.innerText, s1.innerText];
        [i1.src, i2.src] = [i2.src, i1.src];
        calculateSwap();
    }

    function showPage(id) {
        document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(document.getElementById('nav-'+id)) document.getElementById('nav-'+id).classList.add('active');
    }

    function createNewWallet() {
        const kp = solanaWeb3.Keypair.generate();
        localStorage.setItem('w_pub', kp.publicKey.toString());
        localStorage.setItem('w_sec', "[" + kp.secretKey.toString() + "]");
        renderApp();
    }

    function updateWallet() {
        const p = localStorage.getItem('w_pub');
        if(p) {
            document.getElementById('setupWallet').style.display = 'none';
            document.getElementById('viewWallet').style.display = 'block';
            document.getElementById('pubKeyDisplay').innerText = p;
            document.getElementById('phraseDisplay').innerText = localStorage.getItem('w_sec');
            document.getElementById('walletSummary').innerText = p.substring(0,6)+"..."+p.substring(p.length-4);
        }
    }

    function togglePhrase() {
        const d = document.getElementById('phraseDisplay');
        d.style.display = d.style.display === 'none' ? 'block' : 'none';
    }

    function startScan() {
        document.getElementById('reader').style.display = 'block';
        scanner = new Html5Qrcode("reader");
        scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => { alert(txt); scanner.stop(); });
    }

    function resetData() { if(confirm("Hapus data?")) { localStorage.clear(); location.reload(); } }

    window.onload = () => {
        renderApp();
        updatePrices();
        setInterval(updatePrices, 60000); // Update tiap 1 menit
    };
</script>
</body>
</html>
