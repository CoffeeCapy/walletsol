<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Hunter Pro - Settings Edition</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #0b0e11; --card: #1e2329; --primary: #02c076; --text: #eaeaea; --accent: #474d57; --input: #2b3139; --danger: #f6465d; }
        .light-mode { --bg: #f0f2f5; --card: #ffffff; --text: #000000; --accent: #e4e6eb; --input: #f0f2f5; }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; transition: 0.3s; }
        .container { background: var(--card); padding: 25px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #333; min-height: 550px; display: flex; flex-direction: column; }
        
        .content { display: none; animation: fadeIn 0.2s; flex-grow: 1; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Settings Style */
        .setting-group { text-align: left; margin-top: 15px; }
        .setting-item { display: flex; align-items: center; justify-content: space-between; padding: 14px; background: var(--input); border-radius: 12px; margin-bottom: 10px; cursor: pointer; border: 1px solid transparent; }
        .setting-info { display: flex; align-items: center; gap: 12px; }
        .setting-icon { font-size: 18px; width: 24px; text-align: center; }
        
        /* Switch/Toggle Button */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Nav Bawah */
        .tabs { display: flex; justify-content: space-around; margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; }
        .tab-btn { background: none; border: none; color: #848e9c; cursor: pointer; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .tab-btn.active { color: var(--primary); }

        .btn-action { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body id="bodyTag">

<div class="container">
    
    <div id="home" class="content active">
        <img src="https://cryptologos.cc/logos/solana-sol-logo.png" style="width: 50px; margin-top: 20px;">
        <h2>0.00 SOL</h2>
        <div id="qrcode" style="background: white; padding: 10px; border-radius: 10px; display: inline-block;"></div>
        <p style="font-size: 11px; color: #848e9c; margin-top: 10px;" id="addrDisplay">Loading...</p>
    </div>

    <div id="settings" class="content">
        <h3 style="text-align: left; margin-bottom: 20px;">Pengaturan</h3>

        <div class="setting-group">
            <div class="setting-item">
                <div class="setting-info">
                    <span class="setting-icon">🌙</span>
                    <span>Dark Mode</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle" checked onchange="toggleDarkMode()">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item" onclick="scanQR()">
                <div class="setting-info">
                    <span class="setting-icon">📷</span>
                    <span>Scan QR Barcode</span>
                </div>
                <span style="color:#848e9c;">❯</span>
            </div>

            <div class="setting-item" onclick="alert('WalletConnect Sedang Menghubungkan...')">
                <div class="setting-info">
                    <span class="setting-icon">🔗</span>
                    <span>Wallet Connect</span>
                </div>
                <span style="background:#444; font-size:10px; padding:2px 6px; border-radius:4px;">Beta</span>
            </div>

            <div class="setting-item" onclick="alert('Notifikasi diaktifkan')">
                <div class="setting-info">
                    <span class="setting-icon">🔔</span>
                    <span>Preferences Notification</span>
                </div>
                <span style="color:#848e9c;">On</span>
            </div>

            <hr style="border: 0.1px solid #333; margin: 20px 0;">

            <div class="setting-item" onclick="toggleSecret()">
                <div class="setting-info">
                    <span class="setting-icon">🔑</span>
                    <span>Backup Secret Key</span>
                </div>
            </div>

            <div class="setting-item" onclick="buatWalletBaru()">
                <div class="setting-info">
                    <span class="setting-icon" style="color:var(--danger)">🗑️</span>
                    <span style="color:var(--danger)">Buat Wallet Baru</span>
                </div>
            </div>
        </div>

        <div id="secretBox" style="display:none; background:#111; padding:15px; border-radius:10px; font-size:10px; word-break:break-all; border:1px solid var(--danger); margin-top:10px;">
            <b style="color:var(--danger)">JANGAN SEBARKAN:</b><br><br>
            <span id="keyVal"></span>
        </div>
    </div>

    <div id="tokens" class="content"><h3>Market</h3></div>
    <div id="swap" class="content"><h3>Swap</h3></div>

    <div class="tabs">
        <button id="t-home" class="tab-btn active" onclick="openTab('home')">🏠<br>Home</button>
        <button id="t-tokens" class="tab-btn" onclick="openTab('tokens')">🪙<br>Tokens</button>
        <button id="t-swap" class="tab-btn" onclick="openTab('swap')">🔄<br>Swap</button>
        <button id="t-settings" class="tab-btn" onclick="openTab('settings')">⚙️<br>Settings</button>
    </div>
</div>

<script>
    function openTab(name) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        document.getElementById('t-'+name).classList.add('active');
    }

    function toggleDarkMode() {
        const isChecked = document.getElementById('darkModeToggle').checked;
        if (!isChecked) {
            document.getElementById('bodyTag').classList.add('light-mode');
        } else {
            document.getElementById('bodyTag').classList.remove('light-mode');
        }
    }

    function scanQR() {
        alert("Membuka Kamera... Fitur Scan sedang mengakses alamat dompet target.");
        // Di sini bisa ditambahkan library instascan atau html5-qrcode nanti
    }

    function toggleSecret() {
        const x = document.getElementById('secretBox');
        x.style.display = x.style.display === 'none' ? 'block' : 'none';
    }

    function muatWallet() {
        const saved = localStorage.getItem("solana_pro_key");
        if (saved) {
            const kp = solanaWeb3.Keypair.fromSecretKey(new Uint8Array(JSON.parse(saved)));
            const addr = kp.publicKey.toBase58();
            document.getElementById('addrDisplay').innerText = addr;
            document.getElementById('keyVal').innerText = saved;
            new QRCode(document.getElementById("qrcode"), { text: addr, width: 100, height: 100 });
        } else {
            const kp = solanaWeb3.Keypair.generate();
            localStorage.setItem("solana_pro_key", JSON.stringify(Array.from(kp.secretKey)));
            location.reload();
        }
    }

    function buatWalletBaru() {
        if(confirm("Hapus wallet lama dan buat baru? Pastikan sudah backup!")) {
            localStorage.clear();
            location.reload();
        }
    }

    window.onload = muatWallet;
</script>
</body>
</html>
