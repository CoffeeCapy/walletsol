<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Pro Wallet + History</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #0b0e11; --card: #1e2329; --primary: #02c076; --text: #eaeaea; --accent: #474d57; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: var(--card); padding: 25px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #333; }
        .logo { width: 45px; margin-bottom: 10px; }
        .balance-amount { font-size: 32px; font-weight: bold; margin: 5px 0; }
        .fiat-val { color: var(--primary); font-size: 16px; margin-bottom: 20px; }
        #qrcode { background: white; padding: 10px; border-radius: 12px; display: inline-block; margin-bottom: 20px; }
        .address-box { background: #0b0e11; padding: 12px; border-radius: 10px; font-size: 10px; word-break: break-all; color: #b7bdc6; margin-bottom: 20px; border: 1px solid var(--accent); cursor: pointer; }
        button { background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        
        /* Style Riwayat */
        .history-section { text-align: left; margin-top: 25px; border-top: 1px solid #333; padding-top: 15px; }
        .history-item { background: #161a1e; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
        .status-success { color: var(--primary); font-weight: bold; }
        .btn-reset { background: transparent; color: #ff4d4d; border: 1px solid #444; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://cryptologos.cc/logos/solana-sol-logo.png" class="logo">
    <div style="color: #848e9c; font-size: 13px;">Saldo Dompet</div>
    <div class="balance-amount">0.00 SOL</div>
    <div id="priceDisplay" class="fiat-val">Memuat harga...</div>
    
    <div id="qrcode"></div>

    <div style="color: #848e9c; font-size: 12px; text-align: left; margin-bottom: 5px;">Alamat (Tap untuk Salin):</div>
    <div class="address-box" id="addressDisplay" onclick="copyAddr()">CZnC1a...8CVy</div>
    
    <button onclick="buatWalletBaru()">Buat Wallet Baru</button>

    <div class="history-section">
        <div style="font-weight: bold; font-size: 14px; margin-bottom: 10px;">Riwayat Aktivitas</div>
        <div id="historyList">
            </div>
    </div>

    <button class="btn-reset" onclick="hapusWallet()">Hapus & Reset Data</button>
    <div style="font-size: 10px; color: #848e9c; margin-top: 15px;">Solana Devnet Mode</div>
</div>

<script>
    function simpanKeHistory(pesan) {
        let history = JSON.parse(localStorage.getItem("wallet_history") || "[]");
        const waktu = new Date().toLocaleTimeString();
        history.unshift({ pesan, waktu });
        if(history.length > 5) history.pop(); // Simpan 5 terakhir saja
        localStorage.setItem("wallet_history", JSON.stringify(history));
        tampilkanHistory();
    }

    function tampilkanHistory() {
        const list = document.getElementById("historyList");
        const history = JSON.parse(localStorage.getItem("wallet_history") || "[]");
        list.innerHTML = history.map(item => `
            <div class="history-item">
                <span>${item.pesan}</span>
                <span class="status-success">${item.waktu}</span>
            </div>
        `).join('') || '<div style="color:#474d57; font-size:11px;">Belum ada aktivitas</div>';
    }

    function simpanWallet(kp) {
        const secret = JSON.stringify(Array.from(kp.secretKey));
        localStorage.setItem("solana_pro_key", secret);
    }

    function muatWallet() {
        const saved = localStorage.getItem("solana_pro_key");
        if (saved) {
            const arr = new Uint8Array(JSON.parse(saved));
            return solanaWeb3.Keypair.fromSecretKey(arr);
        }
        return null;
    }

    function updateQR(addr) {
        const container = document.getElementById("qrcode");
        container.innerHTML = ""; 
        new QRCode(container, { text: addr, width: 120, height: 120 });
    }

    async function getHarga() {
        try {
            const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=idr');
            const d = await r.json();
            document.getElementById('priceDisplay').innerText = `≈ Rp ${d.solana.idr.toLocaleString('id-ID')}`;
        } catch (e) { document.getElementById('priceDisplay').innerText = "Harga Offline"; }
    }

    function buatWalletBaru() {
        if(confirm("Buat wallet baru?")) {
            const kp = solanaWeb3.Keypair.generate();
            simpanWallet(kp);
            tampilkan(kp);
            simpanKeHistory("Wallet Baru Dibuat");
        }
    }

    function tampilkan(kp) {
        const addr = kp.publicKey.toBase58();
        document.getElementById('addressDisplay').innerText = addr;
        updateQR(addr);
    }

    function hapusWallet() {
        if(confirm("Hapus semua data?")) {
            localStorage.clear();
            location.reload();
        }
    }

    function copyAddr() {
        const text = document.getElementById('addressDisplay').innerText;
        navigator.clipboard.writeText(text);
        alert("Alamat disalin!");
        simpanKeHistory("Alamat Disalin");
    }

    window.onload = () => {
        getHarga();
        tampilkanHistory();
        const lama = muatWallet();
        if(lama) tampilkan(lama);
    };
</script>
</body>
</html>
