<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Hunter - Complete Pro</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --bg: #0b0e11; --card: #1e2329; --primary: #02c076; --text: #eaeaea; 
            --accent: #474d57; --input: #2b3139; --danger: #f6465d; --card-inner: #161a1e; 
        }
        .light-mode { 
            --bg: #f7f8fa; --card: #ffffff; --text: #1e2329; 
            --accent: #e4e6eb; --input: #f0f2f5; --card-inner: #f0f2f5; 
        }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 15px; margin: 0; transition: 0.3s; }
        .container { background: var(--card); padding: 20px; border-radius: 28px; width: 100%; max-width: 400px; text-align: center; border: 1px solid rgba(128,128,128,0.1); min-height: 600px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: relative; }
        
        /* Navigasi Konten */
        .content { display: none; flex-direction: column; flex-grow: 1; animation: fadeIn 0.3s ease; }
        .content.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- HOME STYLE --- */
        .logo-home { width: 50px; margin-top: 30px; }
        .balance-val { font-size: 36px; font-weight: bold; margin: 10px 0 5px 0; }
        .fiat-val { color: var(--primary); font-size: 18px; margin-bottom: 25px; }
        #qrcode { background: white; padding: 10px; border-radius: 15px; display: inline-block; margin-bottom: 20px; }
        .addr-box { background: var(--card-inner); padding: 12px; border-radius: 12px; font-size: 11px; color: #848e9c; cursor: pointer; border: 1px solid rgba(128,128,128,0.1); word-break: break-all; }

        /* --- MARKET STYLE --- */
        .market-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .token-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--card-inner); border-radius: 18px; cursor: pointer; transition: 0.2s; }
        .token-item:active { transform: scale(0.98); }

        /* --- SWAP STYLE (MIRIP GAMBAR) --- */
        .swap-card-pro { background: var(--card-inner); border-radius: 20px; padding: 18px; text-align: left; margin-bottom: 5px; position: relative; }
        .swap-label-row { display: flex; justify-content: space-between; font-size: 13px; color: #848e9c; margin-bottom: 12px; }
        .token-pill { display: flex; align-items: center; background: var(--card); padding: 8px 12px; border-radius: 50px; border: 1px solid rgba(128,128,128,0.1); cursor: pointer; }
        .swap-input { background: none; border: none; color: var(--text); font-size: 26px; font-weight: bold; text-align: right; width: 50%; outline: none; }
        .chip { background: var(--accent); color: var(--primary); border: none; padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .switch-wrapper { height: 10px; display: flex; justify-content: center; align-items: center; position: relative; z-index: 10; }
        .switch-circle { background: var(--card); border: 4px solid var(--bg); color: var(--text); width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

        /* --- SETTINGS STYLE --- */
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--card-inner); border-radius: 16px; margin-bottom: 10px; cursor: pointer; }
        
        /* Toggle Switch */
        .switch { position: relative; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #555; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: var(--primary); }
        input:checked + .slider:before { transform: translateX(18px); }

        .continue-btn { background: var(--primary); color: #0b0e11; border: none; padding: 18px; border-radius: 50px; font-weight: 800; width: 100%; cursor: pointer; font-size: 16px; margin-top: auto; }

        /* --- BOTTOM NAV --- */
        .tabs { display: flex; justify-content: space-around; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(128,128,128,0.1); }
        .tab-btn { background: none; border: none; color: #848e9c; cursor: pointer; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body id="mainBody">

<div class="container">
    
    <div id="home" class="content active">
        <img src="https://cryptologos.cc/logos/solana-sol-logo.png" class="logo-home">
        <div class="balance-val" id="solBalText">0.00 SOL</div>
        <div class="fiat-val" id="fiatText">≈ Rp 0</div>
        <div id="qrcode"></div>
        <div class="addr-box" id="addrText" onclick="copyText()">Loading...</div>
    </div>

    <div id="tokens" class="content">
        <h3 style="text-align: left; margin-bottom: 20px;">Market Assets</h3>
        <div class="market-list">
            <div class="token-item" onclick="goSwap('SOL')">
                <div style="display:flex; align-items:center; gap:12px;">
                    <img src="https://cryptologos.cc/logos/solana-sol-logo.png" width="35">
                    <div style="text-align:left;"><b>SOL</b><br><small style="color:#848e9c">Solana Network</small></div>
                </div>
                <b>0.00</b>
            </div>
            <div class="token-item" onclick="goSwap('BTC')">
                <div style="display:flex; align-items:center; gap:12px;">
                    <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" width="35">
                    <div style="text-align:left;"><b>BTC</b><br><small style="color:#848e9c">Bitcoin</small></div>
                </div>
                <b>0.00</b>
            </div>
        </div>
    </div>

    <div id="swap" class="content">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center">
            <h3 style="margin:0">Trade</h3>
            <span style="font-size:18px">🕒</span>
        </div>

        <div class="swap-card-pro">
            <div class="swap-label-row">
                <span>From</span>
                <span>👛 <span id="maxBalSwap">0.00</span></span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="token-pill">
                    <img id="from-img" src="https://cryptologos.cc/logos/solana-sol-logo.png" width="22">
                    <span id="from-sym" style="margin-left:8px; font-weight:bold">SOL</span>
                    <span style="margin-left:5px; font-size:10px">❯</span>
                </div>
                <input type="number" class="swap-input" id="inp-from" placeholder="0">
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
                <small style="color:#848e9c">Network Fee: 2%</small>
                <div style="display:flex; gap:5px;">
                    <button class="chip" onclick="setVal(0.25)">25%</button>
                    <button class="chip" onclick="setVal(0.5)">50%</button>
                    <button class="chip" onclick="setVal(1)">Max</button>
                </div>
            </div>
        </div>

        <div class="switch-wrapper">
            <div class="switch-circle" onclick="swapNow()">⇅</div>
        </div>

        <div class="swap-card-pro">
            <div class="swap-label-row">
                <span>To</span>
                <span>Balance: 0</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="token-pill">
                    <img id="to-img" src="https://cryptologos.cc/logos/usd-coin-usdc-logo.png" width="22">
                    <span id="to-sym" style="margin-left:8px; font-weight:bold">USDC</span>
                    <span style="margin-left:5px; font-size:10px">❯</span>
                </div>
                <input type="number" class="swap-input" id="inp-to" placeholder="0" readonly>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
                <small style="color:#848e9c">Stable Coin</small>
                <small style="color:#848e9c">Rp 0</small>
            </div>
        </div>
        <button class="continue-btn" onclick="alert('Proceeding transaction...')">Continue</button>
    </div>

    <div id="settings" class="content">
        <h3 style="text-align: left; margin-bottom: 20px;">Settings</h3>
        <div class="setting-row">
            <div style="display:flex; align-items:center; gap:12px;"><span>🌙</span> Dark Mode</div>
            <label class="switch">
                <input type="checkbox" id="darkSwitcher" checked onchange="toggleDark()">
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-row" onclick="alert('Scanning QR...')">
            <div style="display:flex; align-items:center; gap:12px;"><span>📷</span> Scan QR Barcode</div>
            <span>❯</span>
        </div>
        <div class="setting-row" onclick="alert('Connecting Wallet...')">
            <div style="display:flex; align-items:center; gap:12px;"><span>🔗</span> Wallet Connect</div>
            <span style="font-size:10px; background:var(--accent); padding:2px 5px; border-radius:4px">BETA</span>
        </div>
        <div class="setting-row" style="margin-top:20px; color:var(--danger)" onclick="resetWallet()">
            <div style="display:flex; align-items:center; gap:12px;"><span>🗑️</span> Reset Wallet</div>
        </div>
    </div>

    <div class="tabs">
        <button id="btn-home" class="tab-btn active" onclick="openTab('home')">🏠<br>Home</button>
        <button id="btn-tokens" class="tab-btn" onclick="openTab('tokens')">🪙<br>Market</button>
        <button id="btn-swap" class="tab-btn" onclick="openTab('swap')">🔄<br>Trade</button>
        <button id="btn-settings" class="tab-btn" onclick="openTab('settings')">⚙️<br>Settings</button>
    </div>
</div>

<script>
    function openTab(id) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('btn-'+id).classList.add('active');
    }

    function toggleDark() {
        const isChecked = document.getElementById('darkSwitcher').checked;
        document.getElementById('mainBody').className = isChecked ? '' : 'light-mode';
    }

    function goSwap(sym) {
        document.getElementById('from-sym').innerText = sym;
        openTab('swap');
    }

    function swapNow() {
        const f = document.getElementById('from-sym').innerText;
        const t = document.getElementById('to-sym').innerText;
        document.getElementById('from-sym').innerText = t;
        document.getElementById('to-sym').innerText = f;
    }

    function muatWallet() {
        const key = localStorage.getItem("solana_pro_key");
        if(key) {
            const kp = solanaWeb3.Keypair.fromSecretKey(new Uint8Array(JSON.parse(key)));
            const addr = kp.publicKey.toBase58();
            document.getElementById('addrText').innerText = addr;
            new QRCode(document.getElementById("qrcode"), { text: addr, width: 120, height: 120 });
        } else {
            const kp = solanaWeb3.Keypair.generate();
            localStorage.setItem("solana_pro_key", JSON.stringify(Array.from(kp.secretKey)));
            location.reload();
        }
    }

    function copyText() {
        navigator.clipboard.writeText(document.getElementById('addrText').innerText);
        alert("Address Copied!");
    }

    function resetWallet() {
        if(confirm("Hapus wallet?")) { localStorage.clear(); location.reload(); }
    }

    window.onload = muatWallet;
</script>
</body>
</html>
