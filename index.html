<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Super Wallet Pro</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #0b0e11; --card: #1e2329; --primary: #02c076; --text: #eaeaea; --accent: #474d57; --input: #2b3139; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: var(--card); padding: 25px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #333; position: relative; }
        
        /* Tab Navigation */
        .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: #848e9c; cursor: pointer; font-weight: bold; font-size: 14px; padding: 5px 10px; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        
        .content { display: none; }
        .content.active { display: block; }

        /* Wallet Style */
        .balance-amount { font-size: 32px; font-weight: bold; margin: 5px 0; }
        .fiat-val { color: var(--primary); font-size: 16px; margin-bottom: 20px; }
        #qrcode { background: white; padding: 10px; border-radius: 12px; display: inline-block; margin-bottom: 15px; }
        .address-box { background: #0b0e11; padding: 12px; border-radius: 10px; font-size: 10px; word-break: break-all; color: #b7bdc6; margin-bottom: 15px; border: 1px solid var(--accent); cursor: pointer; }

        /* Token List Style */
        .token-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--input); border-radius: 12px; margin-bottom: 10px; text-align: left; }
        .token-info { display: flex; align-items: center; gap: 10px; }
        .token-icon { width: 30px; height: 30px; border-radius: 50%; background: #444; }

        /* Swap Style */
        .swap-box { background: var(--input); padding: 15px; border-radius: 15px; margin-bottom: 10px; text-align: left; }
        .swap-input { background: none; border: none; color: white; font-size: 20px; width: 100%; outline: none; margin-top: 5px; }
        .swap-label { font-size: 12px; color: #848e9c; }

        button.main-btn { background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; font-size: 16px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('wallet')">Wallet</button>
        <button class="tab-btn" onclick="openTab('tokens')">Tokens</button>
        <button class="tab-btn" onclick="openTab('swap')">Swap</button>
    </div>

    <div id="wallet" class="content active">
        <img src="https://cryptologos.cc/logos/solana-sol-logo.png" style="width: 40px; margin-bottom: 10px;">
        <div style="color: #848e9c; font-size: 13px;">Total Balance</div>
        <div class="balance-amount">0.00 SOL</div>
        <div id="priceDisplay" class="fiat-val">≈ Rp 1.454.257</div>
        <div id="qrcode"></div>
        <div class="address-box" id="addressDisplay" onclick="copyAddr()">Loading Address...</div>
        <button class="main-btn" onclick="buatWalletBaru()">Generate New Wallet</button>
    </div>

    <div id="tokens" class="content">
        <h3 style="text-align: left; margin-bottom: 15px;">Your Assets</h3>
        <div class="token-item">
            <div class="token-info">
                <div class="token-icon" style="background: #14f195;"></div>
                <div><b>Solana</b><br><small>SOL</small></div>
            </div>
            <div style="text-align: right;"><b>0.00</b><br><small>Rp 0</small></div>
        </div>
        <div class="token-item">
            <div class="token-info">
                <div class="token-icon" style="background: #2775ca;"></div>
                <div><b>USD Coin</b><br><small>USDC</small></div>
            </div>
            <div style="text-align: right;"><b>0.00</b><br><small>Rp 0</small></div>
        </div>
        <div class="token-item">
            <div class="token-info">
                <div class="token-icon" style="background: #f3ba2f;"></div>
                <div><b>Binance USD</b><br><small>BUSD</small></div>
            </div>
            <div style="text-align: right;"><b>0.00</b><br><small>Rp 0</small></div>
        </div>
    </div>

    <div id="swap" class="content">
        <h3 style="text-align: left; margin-bottom: 15px;">Swap Tokens</h3>
        <div class="swap-box">
            <div class="swap-label">You Pay</div>
            <input type="number" class="swap-input" placeholder="0.00">
            <div style="font-size: 12px; margin-top: 5px;">SOL (Balance: 0.00)</div>
        </div>
        <div style="margin: -5px 0; font-size: 20px; position: relative; z-index: 10;">⬇️</div>
        <div class="swap-box">
            <div class="swap-label">You Receive</div>
            <input type="number" class="swap-input" placeholder="0.00" readonly>
            <div style="font-size: 12px; margin-top: 5px;">USDC</div>
        </div>
        <button class="main-btn">Tukar Sekarang</button>
    </div>

    <div style="font-size: 10px; color: #848e9c; margin-top: 20px;">
        Solana Devnet Mode
    </div>
</div>

<script>
    // FUNGSI NAVIGASI TAB
    function openTab(tabName) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // FUNGSI CORE (GABUNGAN DARI KODE SEBELUMNYA)
    function simpanWallet(kp) {
        const secret = JSON.stringify(Array.from(kp.secretKey));
        localStorage.setItem("solana_pro_key", secret);
    }

    function muatWallet() {
        const saved = localStorage.getItem("solana_pro_key");
        if (saved) {
            try {
                const arr = new Uint8Array(JSON.parse(saved));
                return solanaWeb3.Keypair.fromSecretKey(arr);
            } catch(e) { return null; }
        }
        return null;
    }

    function updateQR(addr) {
        const container = document.getElementById("qrcode");
        container.innerHTML = ""; 
        new QRCode(container, { text: addr, width: 120, height: 120 });
    }

    function buatWalletBaru() {
        if(confirm("Generate new wallet?")) {
            const kp = solanaWeb3.Keypair.generate();
            simpanWallet(kp);
            tampilkan(kp);
        }
    }

    function tampilkan(kp) {
        const addr = kp.publicKey.toBase58();
        document.getElementById('addressDisplay').innerText = addr;
        updateQR(addr);
    }

    function copyAddr() {
        const text = document.getElementById('addressDisplay').innerText;
        navigator.clipboard.writeText(text);
        alert("Alamat disalin ke clipboard!");
    }

    window.onload = () => {
        const lama = muatWallet();
        if(lama) tampilkan(lama);
    };
</script>
</body>
</html>
