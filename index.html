<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Hunter Pro</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #0b0e11; --card: #1e2329; --primary: #02c076; --text: #eaeaea; --accent: #474d57; --input: #2b3139; --danger: #f6465d; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: var(--card); padding: 25px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #333; min-height: 550px; display: flex; flex-direction: column; }
        
        .content { display: none; animation: fadeIn 0.2s ease-in; flex-grow: 1; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Style Home (Sangat Bersih) */
        .logo-home { width: 60px; margin: 20px 0 10px; }
        .balance-title { color: #848e9c; font-size: 14px; }
        .balance-val { font-size: 36px; font-weight: bold; margin: 5px 0; }
        .fiat-val { color: var(--primary); font-size: 18px; margin-bottom: 30px; }
        #qrcode { background: white; padding: 8px; border-radius: 12px; display: inline-block; margin-bottom: 20px; }
        .addr-box { background: #161a1e; padding: 12px; border-radius: 10px; font-size: 11px; color: #b7bdc6; cursor: pointer; border: 1px solid #333; }

        /* List Token & Settings */
        .item-list { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #161a1e; border-radius: 16px; margin-bottom: 10px; cursor: pointer; }
        .setting-item { display: flex; align-items: center; gap: 15px; padding: 15px; background: #2b3139; border-radius: 12px; margin-bottom: 10px; cursor: pointer; text-align: left; }
        
        /* Navigasi */
        .tabs { display: flex; justify-content: space-around; margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; }
        .tab-btn { background: none; border: none; color: #848e9c; cursor: pointer; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .tab-btn.active { color: var(--primary); }

        .input-ca { background: var(--input); border: 1px solid #444; color: white; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; outline: none; }
        button.main-btn { background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; }
        .danger-text { color: var(--danger); font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="home" class="content active">
        <img src="https://cryptologos.cc/logos/solana-sol-logo.png" class="logo-home">
        <div class="balance-title">Main Wallet</div>
        <div class="balance-val" id="solBalance">0.00 SOL</div>
        <div class="fiat-val" id="fiatValue">≈ Rp 0</div>
        
        <div id="qrcode"></div>
        <div class="addr-box" id="addrDisplay" onclick="copyText('addrDisplay')">Memuat Alamat...</div>
    </div>

    <div id="tokens" class="content">
        <h3 style="text-align: left;">Market</h3>
        <div id="tokenList">
            <div class="item-list" onclick="goToSwap('SOL')">
                <div style="display:flex; align-items:center; gap:12px;">
                    <img src="https://cryptologos.cc/logos/solana-sol-logo.png" style="width:32px;">
                    <div style="text-align:left;"><b>SOL</b><br><small id="p-sol" style="color:#848e9c">Rp 0</small></div>
                </div>
                <b>0.00</b>
            </div>
        </div>
        <div style="margin-top: 20px; border-top: 1px solid #333; padding-top: 15px;">
            <input type="text" id="caInput" class="input-ca" placeholder="Masukkan CA Token...">
            <button style="background:var(--accent); color:white; border:none; padding:10px; border-radius:10px; width:100%; cursor:pointer;" onclick="importToken()">+ Tambah Token</button>
        </div>
    </div>

    <div id="swap" class="content">
        <h3 style="text-align: left;">Swap</h3>
        <div style="background:var(--input); padding:15px; border-radius:15px; text-align:left; margin-bottom:10px;">
            <small id="sell-label" style="color:#848e9c">Jual SOL</small>
            <input type="number" style="background:none; border:none; color:white; font-size:24px; width:100%; outline:none;" placeholder="0.00">
        </div>
        <div style="margin: 10px 0; font-size: 20px;">⬇️</div>
        <div style="background:var(--input); padding:15px; border-radius:15px; text-align:left;">
            <small style="color:#848e9c">Beli (CA)</small>
            <input type="text" class="input-ca" style="margin-top:5px;" placeholder="Paste CA Tujuan...">
        </div>
        <button class="main-btn" style="margin-top:20px;">Swap Sekarang</button>
    </div>

    <div id="settings" class="content">
        <h3 style="text-align: left;">Pengaturan Wallet</h3>
        
        <div class="setting-item" onclick="showSecret()">
            <span>🔑</span>
            <div><b>Backup Secret Key</b><br><small style="color:#848e9c">Amankan kunci rahasia Anda</small></div>
        </div>

        <div class="setting-item" onclick="buatWalletBaru()" style="border: 1px solid #444;">
            <span>➕</span>
            <div><b>Buat Wallet Baru</b><br><small class="danger-text">Menghapus wallet saat ini</small></div>
        </div>

        <div id="secretDisplay" style="display:none; background:#111; padding:15px; border-radius:10px; font-size:10px; word-break:break-all; margin-top:15px; border:1px solid var(--danger); text-align:left;">
            <b style="color:var(--danger)">KUNCI RAHASIA (SIMPAN!):</b><br><br>
            <span id="keyVal"></span>
        </div>
    </div>

    <div class="tabs">
        <button id="t-home" class="tab-btn active" onclick="openTab('home')">🏠<br>Home</button>
        <button id="t-tokens" class="tab-btn" onclick="openTab('tokens')">🪙<br>Tokens</button>
        <button id="t-swap" class="tab-btn" onclick="openTab('swap')">🔄<br>Swap</button>
        <button id="t-settings" class="tab-btn" onclick="openTab('settings')">⚙️<br>Settings</button>
    </div>

</div>

<script>
    function openTab(name) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        document.getElementById('t-'+name).classList.add('active');
    }

    function showSecret() {
        const div = document.getElementById('secretDisplay');
        div.style.display = div.style.display === 'none' ? 'block' : 'none';
    }

    function muatWallet() {
        const saved = localStorage.getItem("solana_pro_key");
        if (saved) {
            const kp = solanaWeb3.Keypair.fromSecretKey(new Uint8Array(JSON.parse(saved)));
            const addr = kp.publicKey.toBase58();
            document.getElementById('addrDisplay').innerText = addr;
            document.getElementById('keyVal').innerText = saved;
            new QRCode(document.getElementById("qrcode"), { text: addr, width: 120, height: 120 });
        } else {
            // Jika pertama kali buka dan belum ada wallet
            const kp = solanaWeb3.Keypair.generate();
            localStorage.setItem("solana_pro_key", JSON.stringify(Array.from(kp.secretKey)));
            location.reload();
        }
    }

    function buatWalletBaru() {
        if(confirm("PERINGATAN! Wallet saat ini akan dihapus permanen. Pastikan Anda sudah backup Secret Key di menu Settings. Lanjut?")) {
            const kp = solanaWeb3.Keypair.generate();
            localStorage.setItem("solana_pro_key", JSON.stringify(Array.from(kp.secretKey)));
            location.reload();
        }
    }

    function goToSwap(coin) {
        document.getElementById('sell-label').innerText = "Jual " + coin;
        openTab('swap');
    }

    async function updateHarga() {
        try {
            const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=idr');
            const data = await res.json();
            document.getElementById('fiatValue').innerText = `≈ Rp ${data.solana.idr.toLocaleString('id-ID')}`;
            document.getElementById('p-sol').innerText = `Rp ${data.solana.idr.toLocaleString('id-ID')}`;
        } catch(e) {}
    }

    function copyText(id) {
        navigator.clipboard.writeText(document.getElementById(id).innerText);
        alert("Berhasil disalin!");
    }

    window.onload = () => { muatWallet(); updateHarga(); };
</script>
</body>
</html>
